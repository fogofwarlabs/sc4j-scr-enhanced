name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  # Daily run against the newest engine snapshot.
  schedule:
    - cron: '0 3 * * *'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    name: test (${{ matrix.os }})
    # The unit tier needs no SC:R data and no display; it runs on every supported platform.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      # Keeps the line endings of the repository on the Windows runner.
      - name: Keep line endings
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false

      - name: Check out
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Set up the JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Test
        run: ./gradlew test

      - name: Upload the reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports-${{ matrix.os }}
          path: |
            **/build/reports/
            **/build/test-results/
          if-no-files-found: ignore
          retention-days: 14

  # The required status check: it passes only when the tests passed on every platform.
  test:
    name: test
    needs: tests
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check the platform results
        env:
          RESULT: ${{ needs.tests.result }}
        run: |
          if [ "$RESULT" != "success" ]; then
            echo "::error::The tests did not pass on every platform: $RESULT."
            exit 1
          fi
