name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  MOD_ID: scr-enhanced

jobs:
  version:
    name: version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          submodules: true
          fetch-depth: 0

      # The engine version comes from the SC:R build (the submodule scr).
      - name: Read the versions
        id: version
        run: |
          version=$(sed -n 's/^version=//p' gradle.properties | tr -d '\r')
          engine=$(sed -n 's/^sc4jVersion=//p' scr/gradle.properties | tr -d '\r')
          if [ -z "$version" ]; then
            echo "::error::gradle.properties has no version line."
            exit 1
          fi
          if [ -z "$engine" ]; then
            echo "::error::scr/gradle.properties has no sc4jVersion line."
            exit 1
          fi
          case "$version" in
            *-SNAPSHOT)
              echo "::error::main releases only a release version, not $version: set the version in gradle.properties without -SNAPSHOT."
              exit 1 ;;
          esac
          case "$engine" in
            *-SNAPSHOT)
              echo "::error::A released mod builds against a released engine, not $engine: move the submodule scr to a commit whose sc4jVersion is an engine release."
              exit 1 ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Refuse an existing tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
            echo "::error::The tag $TAG already exists: every release needs a new version in gradle.properties."
            exit 1
          fi

  # The mod jar built and tested on a runner of every platform the engine packages, like the engine's packages.
  jars:
    name: jar (${{ matrix.platform }})
    needs: version
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: windows-x64
            runner: windows-latest
          - platform: linux-x64
            runner: ubuntu-latest
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
          - platform: macos-arm64
            runner: macos-latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - name: Keep line endings
        run: git config --global core.autocrlf false

      - name: Check out
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Set up the JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Test and build the mod jar
        run: ./gradlew test :jar

      - name: Upload the mod jar
        uses: actions/upload-artifact@v7
        with:
          name: jar-${{ matrix.platform }}
          path: build/libs/${{ env.MOD_ID }}.jar
          if-no-files-found: error
          retention-days: 7

      - name: Upload the reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports-${{ matrix.platform }}
          path: |
            **/build/reports/
            **/build/test-results/
          if-no-files-found: ignore
          retention-days: 14

  # The jar holds classes and resources only, so every platform builds the same bytes; the release ships that one jar.
  release:
    name: release
    needs: [version, jars]
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download the mod jars
        uses: actions/download-artifact@v8
        with:
          pattern: jar-*
          path: jars

      - name: Check that every platform built the same jar
        # The checksum file has the sha256sum format: the hash, two spaces and the file name.
        run: |
          hashes=$(sha256sum jars/jar-*/"$MOD_ID.jar" | cut -d ' ' -f 1 | sort -u)
          count=$(ls jars/jar-*/"$MOD_ID.jar" | wc -l)
          if [ "$count" -ne 4 ] || [ "$(echo "$hashes" | wc -l)" -ne 1 ]; then
            echo "::error::Expected 4 equal $MOD_ID.jar files, found $count with these hashes: $hashes"
            exit 1
          fi
          mkdir -p release
          cp "jars/jar-windows-x64/$MOD_ID.jar" release/
          echo "$hashes  $MOD_ID.jar" > "release/$MOD_ID.jar.sha256"

      - name: Tag and create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          # The notes list the commits since the previous release tag, without the version changes and the release merges.
          previous=$(git describe --tags --abbrev=0 --match 'v*' "$GITHUB_SHA^" 2>/dev/null || true)
          {
            echo "## What's Changed"
            git log --no-merges --format='* %s' "${previous:+$previous..}$GITHUB_SHA" | grep -v '^\* Bump version to ' || true

            if [ -n "$previous" ]; then
              echo
              echo "**Full Changelog**: https://github.com/$GITHUB_REPOSITORY/compare/$previous...$TAG"
            fi
          } > release-notes.md

          gh release create "$TAG" "release/$MOD_ID.jar" "release/$MOD_ID.jar.sha256" --target "$GITHUB_SHA" --title "$TAG" --notes-file release-notes.md
